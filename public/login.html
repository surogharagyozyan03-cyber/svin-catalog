<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVIN - Ադմինիստրատորի Մուտք</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            min-height: calc(100vh - 350px);
            background-color: #f5f5f5;
        }

        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border-top: 4px solid #222;
        }

        .login-card h2 {
            margin-bottom: 8px;
            font-size: 24px;
            color: #111;
            text-align: center;
        }

        .login-card p {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #222;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #444;
        }

        .error-message {
            color: #d9534f;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-bar-container">
            <div class="top-info">
                <span><i class="fa-solid fa-location-dot"></i> Արցախյան խճուղի 30, Goris, Armenia</span>
                <span><a href="tel:043444787" style="color: inherit; text-decoration: none;"><i class="fa-solid fa-phone"></i> 043 444787</a></span>
            </div>
            <div class="top-socials">
                <a href="https://www.facebook.com/SvinGoris/" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/svin_military_shop/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://t.me/+37443444787" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                <a href="https://wa.me/37443444787" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="main-header">
        <div class="header-container">
            <div class="header-left">
                <div class="logo-wrapper">
                    <a href="index.html">
                        <img src="logo.png" alt="SVIN" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                        <span class="alt-logo" style="display: none;">ՍՎԻՆ</span>
                    </a>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html">Գլխավոր</a>
            </nav>
        </div>
    </header>

    <!-- FORM SECTION -->
    <section class="login-section">
        <div class="login-card">

            <div id="errorMessage" class="error-message">
                Սխալ լոգին կամ գաղտնաբառ:
            </div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">Մուտքանուն </label>
                    <input type="text" id="username" required placeholder="Մուտքագրեք լոգինը">
                </div>

                <div class="form-group">
                    <label for="password">Գաղտնաբառ</label>
                    <input type="password" id="password" required placeholder="Մուտքագրեք գաղտնաբառը">
                </div>

                <button type="submit" class="btn-login">Մուտք</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 ՍՎԻՆ. Բոլոր իրավունքները պաշտպանված են:</p>
        </div>
    </footer>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');

            // Тестовые данные для входа (можно поменять)
            if (user === "admin" && pass === "svin2026") {
                localStorage.setItem('isAdminLoggedIn', 'true');
                window.location.href = 'admin.html'; // Переход в будущую админ-панель
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
